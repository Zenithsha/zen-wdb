version: "3.8"

services:
  db:
    image: postgres:16
    container_name: xblog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - ./pg-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - xblog

  strapi:
    build: ./strapi/xBlog
    container_name: xblog-strapi
    restart: unless-stopped
    env_file:
      - ./strapi/xBlog/.env
    volumes:
      - ./strapi/xBlog/src:/opt/app/src
      - ./strapi/xBlog/config:/opt/app/config
      - ./strapi/xBlog/public/uploads:/opt/app/public/uploads
      - ./strapi/xBlog/types:/opt/app/types
      - strapi_node_modules:/opt/app/node_modules
    ports:
      - "127.0.0.1:1337:1337"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - xblog

  frontend:
    build: ./frontend
    container_name: xblog-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    volumes:
      - ./frontend/src:/app/src
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - strapi
    networks:
      - xblog

volumes:
  strapi_node_modules:
  frontend_node_modules:

networks:
  xblog:
    driver: bridge
